# NGINX Production Configuration for Smitox
# Prevents 413 Payload Too Large errors

# Set maximum allowed request body size (for file uploads)
client_max_body_size 100M;

# Buffer settings for large requests
proxy_buffer_size 128k;
proxy_buffers 4 256k;
proxy_busy_buffers_size 256k;

# Timeout settings for large uploads
proxy_read_timeout 300;
proxy_connect_timeout 300;
proxy_send_timeout 300;

server {
    listen 80;
    server_name smitox.com www.smitox.com;

    # Maximum upload size (also set in http block, but can be overridden here)
    client_max_body_size 100M;

    # Redirect to HTTPS (uncomment when SSL is configured)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Large upload support
        client_max_body_size 100M;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }

    # API routes with larger body size for product creation
    location /api/ {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increased limits for API calls (product creation with images)
        client_max_body_size 100M;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }

    # Static files
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|webp|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

