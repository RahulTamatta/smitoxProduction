services:
  server:
    build: ./server
    container_name: smitox-server-${APP_ENV:-production}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    env_file:
      - ./server/.env
    networks:
      - smitox-net
    volumes:
      - ./server/uploads:/app/uploads
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL:-/api/v1}
    container_name: smitox-client-${APP_ENV:-production}
    ports:
      - "${CLIENT_PORT:-3000}:3000"
    networks:
      - smitox-net
    depends_on:
      - server
    restart: unless-stopped

networks:
  smitox-net:
    driver: bridge
